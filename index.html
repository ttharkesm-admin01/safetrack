<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SafeTrack — รายงานตรวจอุปกรณ์ฉุกเฉิน</title>
<script>
/* Lazy-load pptxgenjs only when exporting (keeps file small for in-app browsers) */
window.__loadPptx = function(){
  return new Promise(function(resolve,reject){
    if(window.PptxGenJS){resolve(window.PptxGenJS);return;}
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js';
    s.onload=function(){resolve(window.PptxGenJS);};
    s.onerror=function(){reject(new Error('โหลดไลบรารีไม่สำเร็จ - ต้องมีอินเทอร์เน็ตตอนกดออก PowerPoint'));};
    document.head.appendChild(s);
  });
};
</script>
<style>
:root{
  --bg:#eef1ee; --panel:#ffffff; --panel2:#f3f6f3; --line:#e2e7e3;
  --txt:#1d2a22; --mut:#6d7c72;
  --green:#188744; --green2:#0f6e34;
  --accent:#e8730f; --accent2:#1f9d6b;
  --pass:#1f9d6b; --fail:#dc3a43; --pend:#94a39a;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:"Sukhumvit Set","Noto Sans Thai",system-ui,sans-serif;font-size:15px;line-height:1.5;padding-bottom:96px}
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--green),var(--green2));border-bottom:1px solid var(--green2);padding:16px;display:flex;align-items:center;gap:12px;color:#fff;box-shadow:0 2px 10px rgba(15,110,52,.25)}
.logo{width:40px;height:40px;border-radius:11px;background:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;color:var(--green);flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.topbar h1{font-size:17px;font-weight:700;letter-spacing:.2px;color:#fff}
.topbar h1 span{color:rgba(255,255,255,.78)!important;font-weight:500;font-size:13px}
.topbar .sub{font-size:11.5px;color:rgba(255,255,255,.72);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 16px 8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;transition:border-color .15s,transform .1s;box-shadow:0 1px 3px rgba(20,50,30,.05)}
.stat:active{transform:scale(.96)}
.stat.active{border-color:var(--green);box-shadow:0 0 0 2px rgba(24,135,68,.25)}
.stat .n{font-size:21px;font-weight:800;line-height:1}
.stat .l{font-size:10.5px;color:var(--mut);margin-top:4px}
.stat.t .n{color:var(--txt)} .stat.p .n{color:var(--pass)} .stat.f .n{color:var(--fail)} .stat.d .n{color:var(--pend)}
/* progress bar */
.prog{padding:0 16px 6px}
.prog .track{height:8px;background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.prog .fill{height:100%;width:0;background:linear-gradient(90deg,var(--green),#3bbf6a);border-radius:20px;transition:width .35s ease}
.prog .pct{font-size:11px;color:var(--mut);margin-top:5px;text-align:center}
.prog .pct b{color:var(--txt)}
.empty{padding:50px 24px;text-align:center;color:var(--mut);font-size:14px}
.bar{padding:0 16px 8px}
.bar input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:12px 14px;border-radius:12px;font-size:14px;font-family:inherit;box-shadow:0 1px 3px rgba(20,50,30,.05)}
.bar input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 2px rgba(24,135,68,.18)}
.bar input::placeholder{color:var(--mut)}
.cat{margin:8px 0}
.cathead{padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);position:sticky;top:72px;z-index:10}
.cathead .chev{color:var(--green)}
.cathead .ct{font-weight:700;font-size:13.5px;flex:1;color:var(--green2)}
.cathead .cn{font-size:11px;color:var(--mut);background:var(--panel2);padding:3px 9px;border-radius:20px}
.cathead .cn-ok{color:#fff;background:var(--pass)}
.cathead .cn-bad{color:#fff;background:var(--fail)}
.cathead .chev{color:var(--mut);transition:transform .2s;font-size:12px}
.cat.collapsed .chev{transform:rotate(-90deg)}
.cat.collapsed .grid{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 4px rgba(20,50,30,.06)}
.card.done{border-color:var(--pass)}
.card.issue{border-color:var(--fail)}
.photo{aspect-ratio:1/.82;background:var(--panel2);position:relative;display:grid;place-items:center;cursor:pointer;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .ph{color:var(--mut);font-size:12px;text-align:center;padding:8px}
.photo .ph svg{display:block;margin:0 auto 6px}
.photo .badge{position:absolute;top:6px;right:6px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;color:#fff}
.cap{padding:9px 10px 10px}
.cap .code{font-weight:800;font-size:13px;color:var(--green2)}
.cap .ord{color:var(--mut);font-weight:600}
.cap .loc{font-size:11.5px;color:var(--txt);margin-top:2px;min-height:15px}
.controls{display:flex;gap:6px;margin-top:9px}
.phactions{display:flex;gap:6px;margin-top:9px}
.phactions button{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:11.5px;font-weight:700;padding:7px 0;border-radius:9px;cursor:pointer;font-family:inherit}
.phactions button.del{flex:0 0 34px;color:var(--fail);border-color:var(--fail)}
.controls button{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--mut);font-size:11.5px;font-weight:700;padding:7px 0;border-radius:9px;cursor:pointer;font-family:inherit}
.controls button.ap{background:var(--pass);border-color:var(--pass);color:#fff}
.controls button.af{background:var(--fail);border-color:var(--fail);color:#fff}
.note{width:100%;margin-top:7px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 9px;font-size:11.5px;font-family:inherit;resize:none}
.fab{position:fixed;left:0;right:0;bottom:0;z-index:40;background:linear-gradient(180deg,transparent,var(--bg) 22%);padding:14px 16px;display:flex;gap:10px}
.fab button{flex:1;border:none;border-radius:13px;padding:15px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.fab .exp{background:linear-gradient(135deg,var(--accent),#ff8a5c);color:#1a1206}
.fab .more{background:var(--panel2);color:var(--txt);border:1px solid var(--line);flex:0 0 52px}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:flex-end}
.sheet.show{display:flex}
.sheet .inner{background:var(--panel);width:100%;border-radius:20px 20px 0 0;padding:20px 18px 30px;border-top:1px solid var(--line)}
.sheet h3{font-size:16px;margin-bottom:14px}
.sheet .row{display:flex;gap:10px;margin-bottom:10px}
.sheet button{flex:1;padding:13px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
.sheet button.danger{color:var(--fail);border-color:var(--fail)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:11px 20px;border-radius:30px;font-size:13px;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:.95}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:20px}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px}
/* back-to-top */
.totop{position:fixed;right:16px;bottom:96px;z-index:35;width:44px;height:44px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);font-size:20px;display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.totop.show{display:flex}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="errbox" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#e0454e;color:#fff;padding:12px 14px;font-size:12.5px;font-family:monospace;white-space:pre-wrap;word-break:break-word;max-height:60vh;overflow:auto"></div>
<script>
(function(){
  function showErr(msg){
    var b=document.getElementById('errbox');
    if(!b)return;
    b.style.display='block';
    b.textContent=(b.textContent?b.textContent+'\n\n':'')+msg;
  }
  window.onerror=function(message,source,lineno,colno,error){
    showErr('JS ERROR: '+message+'\nline '+lineno+':'+colno+(error&&error.stack?'\n'+error.stack:''));
    return false;
  };
  window.addEventListener('unhandledrejection',function(e){
    showErr('PROMISE ERROR: '+(e.reason&&e.reason.message?e.reason.message:e.reason));
  });
  // also report the browser so we know the engine
  window.addEventListener('DOMContentLoaded',function(){
    setTimeout(function(){
      var listEmpty=document.getElementById('list')&&document.getElementById('list').children.length===0;
      var total=document.getElementById('s-total');
      if(listEmpty || (total&&total.textContent==='0')){
        showErr('วินิจฉัย: รายการว่าง\nUA: '+navigator.userAgent+'\nlist children: '+(document.getElementById('list')?document.getElementById('list').children.length:'no #list')+'\nTEMPLATE_DATA: '+(typeof window.TEMPLATE_DATA!=='undefined'?(window.TEMPLATE_DATA.length+' หมวด'):'undefined (ข้อมูลไม่โหลด)'));
      }
    },1500);
  });
})();
</script>
<div class="topbar">
  <div class="logo">ST</div>
  <div style="flex:1">
    <h1>SafeTrack <span style="color:var(--mut);font-weight:500;font-size:13px">รายงานตรวจอุปกรณ์</span></h1>
    <div class="sub">EF-SF-002 · ระบบบันทึก + ออกรายงาน PowerPoint</div>
  </div>
</div>

<div class="stats">
  <div class="stat t" data-filter="all"><div class="n" id="s-total">0</div><div class="l">ทั้งหมด</div></div>
  <div class="stat d" data-filter="pending"><div class="n" id="s-pend">0</div><div class="l">ยังไม่ตรวจ</div></div>
  <div class="stat p" data-filter="pass"><div class="n" id="s-pass">0</div><div class="l">ปกติ</div></div>
  <div class="stat f" data-filter="fail"><div class="n" id="s-fail">0</div><div class="l">ไม่ปกติ</div></div>
</div>

<div class="prog">
  <div class="track"><div class="fill" id="prog-fill"></div></div>
  <div class="pct" id="prog-pct">ตรวจแล้ว <b>0</b> จาก <b>0</b> จุด</div>
</div>

<div class="bar"><input id="search" placeholder="ค้นหา รหัส / ตำแหน่ง / ประเภท…"></div>

<div id="list"></div>

<div class="fab">
  <button class="exp" id="btn-export">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="#1a1206" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    ออก PowerPoint
  </button>
  <button class="more" id="btn-more">⋯</button>
</div>

<div class="sheet" id="sheet">
  <div class="inner">
    <h3>ตัวเลือกเพิ่มเติม</h3>
    <div class="row"><button id="opt-onlyphoto">เลือกออกเฉพาะจุดที่มีรูป</button></div>
    <div class="row"><button id="opt-collapse">ยุบ/ขยายทุกหมวด</button></div>
    <div class="row"><button id="opt-backup">สำรองข้อมูล (ดาวน์โหลด)</button><button id="opt-restore">กู้คืนข้อมูล</button></div>
    <div class="row"><button class="danger" id="opt-clear">ล้างข้อมูลทั้งหมด</button></div>
    <div class="row"><button id="opt-close">ปิด</button></div>
    <input type="file" id="restore-file" accept="application/json" style="display:none">
  </div>
</div>

<button class="totop" id="totop" aria-label="กลับขึ้นบน">↑</button>
<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox"><img id="lb-img"></div>

<!-- persistent file inputs (must be in DOM for mobile browsers) -->
<input type="file" id="file-gallery" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden">
<input type="file" id="file-camera" accept="image/*" capture="environment" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden">

<script>
const LS_KEY='safetrack_ef002_v1';
// Safe storage: in-app browsers (CPF Connext, LINE, etc.) may block localStorage.
// Fall back to in-memory so the app always loads and works.
var memStore={};
var STORAGE_OK=false;
(function(){try{var t='__t';window.localStorage.setItem(t,'1');window.localStorage.removeItem(t);STORAGE_OK=true;}catch(e){STORAGE_OK=false;}})();
function lsGet(k){try{if(STORAGE_OK)return window.localStorage.getItem(k);}catch(e){}return (k in memStore)?memStore[k]:null;}
function lsSet(k,v){try{if(STORAGE_OK){window.localStorage.setItem(k,v);return;}}catch(e){}memStore[k]=v;}
let state={};
try{state=JSON.parse(lsGet(LS_KEY)||'{}');}catch(e){state={};}
let onlyPhotoExport=false;
let activeFilter='all'; // all | pending | pass | fail

function uid(si,pi){return 's'+si+'p'+pi}
function save(){lsSet(LS_KEY,JSON.stringify(state))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}

function render(){
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  const list=document.getElementById('list');list.innerHTML='';
  let tot=0,pass=0,fail=0,photo=0,shown=0;
  TEMPLATE_DATA.forEach((cat,si)=>{
    const matchPts=cat.points.map((p,pi)=>({p,pi})).filter(({p,pi})=>{
      const st=state[uid(si,pi)]||{};
      if(activeFilter==='pending'&&st.result)return false;
      if(activeFilter==='pass'&&st.result!=='pass')return false;
      if(activeFilter==='fail'&&st.result!=='fail')return false;
      if(!q)return true;
      return (p.code+' '+p.location+' '+cat.category).toLowerCase().includes(q);
    });
    let cOk=0,cBad=0;
    cat.points.forEach((p,pi)=>{
      tot++;const st=state[uid(si,pi)]||{};
      if(st.result==='pass'){pass++;cOk++;}if(st.result==='fail'){fail++;cBad++;}if(st.photo)photo++;
    });
    if(matchPts.length===0)return;
    shown+=matchPts.length;
    const wrap=document.createElement('div');wrap.className='cat';wrap.dataset.si=si;
    const okPill=cOk>0?('<span class="cn cn-ok">ปกติ '+cOk+'</span>'):'';
    const badPill=cBad>0?('<span class="cn cn-bad">ไม่ปกติ '+cBad+'</span>'):'';
    wrap.innerHTML='<div class="cathead"><span class="chev">▼</span><span class="ct">'+cat.category+'</span>'+okPill+badPill+'<span class="cn">'+cat.points.length+' จุด</span></div><div class="grid"></div>';
    const grid=wrap.querySelector('.grid');
    matchPts.forEach(({p,pi})=>{
      const id=uid(si,pi);const st=state[id]||{};
      const card=document.createElement('div');
      card.className='card'+(st.result==='fail'?' issue':(st.photo&&st.result?' done':''));
      const ordTxt=p.order?('<span class="ord">'+p.order+'. </span>'):'';
      const codeTxt=p.code?p.code:'(ไม่มีรหัส)';
      const badge=st.result?('<span class="badge" style="background:'+(st.result==='pass'?'var(--pass)':'var(--fail)')+'">'+(st.result==='pass'?'ปกติ':'ไม่ปกติ')+'</span>'):'';
      card.innerHTML=
        '<div class="photo" data-act="'+(st.photo?'view':'gallery')+'" data-id="'+id+'">'+
          (st.photo?('<img src="'+st.photo+'">'+badge):
            ('<div class="ph"><svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M3 8a2 2 0 012-2h2l1.5-2h7L18 6h2a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V8z" stroke="#5a6878" stroke-width="1.6"/><circle cx="12" cy="12.5" r="3.2" stroke="#5a6878" stroke-width="1.6"/></svg>แตะเพื่อเลือกรูป</div>'))+
        '</div>'+
        '<div class="cap">'+
          '<div class="code">'+ordTxt+codeTxt+'</div>'+
          '<div class="loc">'+(p.location||'—')+'</div>'+
          '<div class="phactions">'+
            '<button data-act="gallery" data-id="'+id+'">📁 เลือกรูป</button>'+
            '<button data-act="camera" data-id="'+id+'">📷 ถ่าย</button>'+
            (st.photo?'<button data-act="delphoto" data-id="'+id+'" class="del">✕</button>':'')+
          '</div>'+
          '<div class="controls">'+
            '<button data-act="pass" data-id="'+id+'" class="'+(st.result==='pass'?'ap':'')+'">ปกติ</button>'+
            '<button data-act="fail" data-id="'+id+'" class="'+(st.result==='fail'?'af':'')+'">ไม่ปกติ</button>'+
          '</div>'+
          '<textarea class="note" rows="1" placeholder="หมายเหตุ…" data-act="note" data-id="'+id+'">'+(st.note||'')+'</textarea>'+
        '</div>';
      grid.appendChild(card);
    });
    list.appendChild(wrap);
  });
  const done=pass+fail, pend=tot-done;
  document.getElementById('s-total').textContent=tot;
  document.getElementById('s-pend').textContent=pend;
  document.getElementById('s-pass').textContent=pass;
  document.getElementById('s-fail').textContent=fail;
  // progress
  const pctVal=tot?Math.round(done/tot*100):0;
  document.getElementById('prog-fill').style.width=pctVal+'%';
  document.getElementById('prog-pct').innerHTML='ตรวจแล้ว <b>'+done+'</b> จาก <b>'+tot+'</b> จุด ('+pctVal+'%)';
  // active filter highlight
  document.querySelectorAll('.stat').forEach(s=>s.classList.toggle('active',s.dataset.filter===activeFilter));
  // empty state
  if(shown===0){
    const msg=q?'ไม่พบรายการที่ค้นหา':(activeFilter==='pending'?'ตรวจครบทุกจุดแล้ว 🎉':'ไม่มีรายการในตัวกรองนี้');
    list.innerHTML='<div class="empty">'+msg+'</div>';
  }
}

// delegated events
document.getElementById('list').addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,id=el.dataset.id;
  if(act==='gallery'){pickPhoto(id,false);}
  else if(act==='camera'){pickPhoto(id,true);}
  else if(act==='view'){const st=state[id];if(st&&st.photo){document.getElementById('lb-img').src=st.photo;document.getElementById('lightbox').classList.add('show');}}
  else if(act==='delphoto'){if(confirm('ลบรูปนี้?')){state[id]=state[id]||{};delete state[id].photo;save();render();}}
  else if(act==='pass'||act==='fail'){
    state[id]=state[id]||{};
    state[id].result=(state[id].result===act)?null:act;
    save();render();
  }
});
document.getElementById('list').addEventListener('click',e=>{
  const h=e.target.closest('.cathead');if(!h)return;
  if(e.target.closest('[data-act]'))return;
  h.parentElement.classList.toggle('collapsed');
});
document.getElementById('list').addEventListener('input',e=>{
  const el=e.target.closest('[data-act="note"]');if(!el)return;
  const id=el.dataset.id;state[id]=state[id]||{};state[id].note=el.value;save();
});
document.getElementById('lightbox').addEventListener('click',()=>document.getElementById('lightbox').classList.remove('show'));

let pendingId=null;
function handleFile(inp){
  const f=inp.files&&inp.files[0];
  inp.value=''; // reset so picking same file again works
  if(!f||!pendingId)return;
  const id=pendingId;pendingId=null;
  toast('กำลังประมวลผลรูป…');
  resizeImage(f,1200,.82,dataUrl=>{state[id]=state[id]||{};state[id].photo=dataUrl;save();render();toast('บันทึกรูปแล้ว');});
}
document.getElementById('file-gallery').addEventListener('change',function(){handleFile(this);});
document.getElementById('file-camera').addEventListener('change',function(){handleFile(this);});

function pickPhoto(id,useCamera){
  pendingId=id;
  document.getElementById(useCamera?'file-camera':'file-gallery').click();
}
function resizeImage(file,maxW,quality,cb){
  const img=new Image();const rd=new FileReader();
  rd.onload=()=>{img.onload=()=>{
    let w=img.width,h=img.height;if(w>maxW){h=h*maxW/w;w=maxW;}
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    cb(c.toDataURL('image/jpeg',quality));
  };img.src=rd.result;};
  rd.readAsDataURL(file);
}

document.getElementById('search').addEventListener('input',render);

// stat cards as status filters (tap again to clear)
document.querySelectorAll('.stat').forEach(s=>{
  s.addEventListener('click',()=>{
    const f=s.dataset.filter;
    activeFilter=(activeFilter===f||f==='all')?'all':f;
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  });
});

// back-to-top button
const totop=document.getElementById('totop');
window.addEventListener('scroll',()=>{totop.classList.toggle('show',window.scrollY>400);},{passive:true});
totop.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});

// sheet
const sheet=document.getElementById('sheet');
document.getElementById('btn-more').onclick=()=>sheet.classList.add('show');
document.getElementById('opt-close').onclick=()=>sheet.classList.remove('show');
sheet.addEventListener('click',e=>{if(e.target===sheet)sheet.classList.remove('show')});
document.getElementById('opt-collapse').onclick=()=>{
  const cats=[...document.querySelectorAll('.cat')];
  const anyOpen=cats.some(c=>!c.classList.contains('collapsed'));
  cats.forEach(c=>c.classList.toggle('collapsed',anyOpen));sheet.classList.remove('show');
};
document.getElementById('opt-onlyphoto').onclick=()=>{onlyPhotoExport=!onlyPhotoExport;toast(onlyPhotoExport?'จะออกเฉพาะจุดที่มีรูป':'จะออกทุกจุด');sheet.classList.remove('show');};
document.getElementById('opt-clear').onclick=()=>{if(confirm('ล้างข้อมูลและรูปทั้งหมด?')){state={};save();render();sheet.classList.remove('show');toast('ล้างข้อมูลแล้ว');}};
document.getElementById('opt-backup').onclick=()=>{
  const blob=new Blob([JSON.stringify(state)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='safetrack-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();sheet.classList.remove('show');
};
document.getElementById('opt-restore').onclick=()=>document.getElementById('restore-file').click();
document.getElementById('restore-file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{state=JSON.parse(rd.result);save();render();toast('กู้คืนข้อมูลแล้ว');sheet.classList.remove('show');}catch(err){toast('ไฟล์ไม่ถูกต้อง');}};
  rd.readAsText(f);
};

// ====== EXPORT POWERPOINT ======
document.getElementById('btn-export').onclick=async function(){
  const btn=this;btn.disabled=true;const orig=btn.innerHTML;btn.innerHTML='กำลังสร้าง…';
  try{
    btn.innerHTML='กำลังโหลด…';
    const PGJS = await window.__loadPptx();
    if(!PGJS){throw new Error('ไลบรารี PowerPoint ยังไม่พร้อม');}
    btn.innerHTML='กำลังสร้าง…';
    const pptx=new PGJS();
    pptx.defineLayout({name:'W',width:13.333,height:7.5});
    pptx.layout='W';
    const PER=14, COLS=7, ROWS=2;
    const PW=1.78, PH=1.65;          // photo size (in)
    const GAPX=(13.333-0.14-COLS*PW)/(COLS-1); // distribute
    const x0=0.07, yTop=1.77, yBot=4.10;
    const rowY=[yTop,yBot];
    let pageNo=0;

    // ===== SUMMARY TABLE SLIDE (first page) =====
    pageNo++;
    const sum=pptx.addSlide();
    sum.background={color:'FFFFFF'};
    sum.addText('รายงานผลการดำเนินงานงานหน่วยงาน',{x:0.44,y:0.10,w:12.45,h:0.55,fontSize:24,bold:true,align:'center',color:'1a212b',fontFace:'Angsana New'});
    sum.addText('สรุปผลการตรวจสอบอุปกรณ์ความปลอดภัยและอุปกรณ์ฉุกเฉิน (EF-SF-002)',{x:0.44,y:0.72,w:12.45,h:0.6,fontSize:22,bold:true,align:'center',color:'c0392b',fontFace:'Angsana New'});
    sum.addText(String(pageNo),{x:11.8,y:6.95,w:1.2,h:0.4,fontSize:14,bold:true,align:'right',color:'333333'});

    // build rows: one per category, count ปกติ/ไม่ปกติ, collect ไม่ปกติ notes
    const headFill={color:'FF0000'};
    const rows=[[
      {text:'อุปกรณ์ที่ตรวจ',options:{bold:true,color:'FFFFFF',fill:headFill,align:'center',valign:'middle',fontFace:'Angsana New',fontSize:16}},
      {text:'จำนวนที่มี',options:{bold:true,color:'FFFFFF',fill:headFill,align:'center',valign:'middle',fontFace:'Angsana New',fontSize:16}},
      {text:'ปกติ',options:{bold:true,color:'FFFFFF',fill:headFill,align:'center',valign:'middle',fontFace:'Angsana New',fontSize:16}},
      {text:'ไม่ปกติ',options:{bold:true,color:'FFFFFF',fill:headFill,align:'center',valign:'middle',fontFace:'Angsana New',fontSize:16}},
      {text:'อธิบายสภาพที่ไม่ปกติ',options:{bold:true,color:'FFFFFF',fill:headFill,align:'center',valign:'middle',fontFace:'Angsana New',fontSize:16}}
    ]];
    // merge categories with same name (template repeats some) — group by category text
    const catMap={};const catOrder=[];
    TEMPLATE_DATA.forEach((cat,si)=>{
      const name=cat.category.replace('การตรวจสอบ','').trim();
      if(!catMap[name]){catMap[name]={total:0,ok:0,bad:0,notes:[]};catOrder.push(name);}
      cat.points.forEach((p,pi)=>{
        catMap[name].total++;
        const st=state['s'+si+'p'+pi]||{};
        if(st.result==='pass')catMap[name].ok++;
        if(st.result==='fail'){catMap[name].bad++;
          const label=(p.code||p.location||('จุดที่ '+(pi+1)));
          catMap[name].notes.push(label+(st.note?(': '+st.note):''));
        }
      });
    });
    catOrder.forEach(name=>{
      const c=catMap[name];
      const cell=(t,al)=>({text:String(t),options:{align:al||'center',valign:'middle',fontFace:'Angsana New',fontSize:13,color:'1a212b'}});
      rows.push([
        {text:name,options:{align:'left',valign:'middle',fontFace:'Angsana New',fontSize:13,bold:true,color:'1a212b'}},
        cell(c.total||'-'),
        cell(c.ok||(c.ok===0&&c.bad===0?'-':0)),
        cell(c.bad||(c.bad===0?'':0)),
        {text:c.notes.join('\n'),options:{align:'left',valign:'middle',fontFace:'Angsana New',fontSize:12,color:'c0392b'}}
      ]);
    });
    sum.addTable(rows,{
      x:0.3,y:1.5,w:12.7,
      colW:[4.06,1.74,1.29,0.95,4.66],
      border:{type:'solid',color:'888888',pt:1},
      valign:'middle',
      autoPage:true,autoPageRepeatHeader:true,autoPageLineWeight:-0.5,
      newSlideStartY:1.0
    });

    // ===== PER-POINT PHOTO SLIDES =====
    TEMPLATE_DATA.forEach(cat=>{
      let pts=cat.points.map((p,pi)=>({p,pi}));
      if(onlyPhotoExport)pts=pts.filter(({p},i)=>true); // filter below by photo
      // build list of points to include
      const items=cat.points.map((p,pi)=>({p,st:state['s'+TEMPLATE_DATA.indexOf(cat)+'p'+pi]||{}}))
        .filter(it=> onlyPhotoExport ? !!it.st.photo : true);
      if(items.length===0 && onlyPhotoExport) return;
      for(let off=0; off<Math.max(items.length,1); off+=PER){
        const chunk=items.slice(off,off+PER);
        pageNo++;
        const s=pptx.addSlide();
        s.background={color:'FFFFFF'};
        s.addText('รายงานผลการดำเนินงานงานหน่วยงาน',{x:0.44,y:0.10,w:12.45,h:0.55,fontSize:24,bold:true,align:'center',color:'1a212b',fontFace:'Angsana New'});
        s.addText(cat.category,{x:0.44,y:0.75,w:12.45,h:0.7,fontSize:26,bold:true,align:'center',color:'c0392b',fontFace:'Angsana New'});
        s.addText(String(pageNo),{x:11.8,y:6.95,w:1.2,h:0.4,fontSize:14,bold:true,align:'right',color:'333333'});
        chunk.forEach((it,k)=>{
          const col=k%COLS, row=Math.floor(k/COLS);
          const x=x0+col*(PW+GAPX), y=rowY[row];
          if(it.st.photo){
            s.addImage({data:it.st.photo,x:x,y:y,w:PW,h:PH});
          }else{
            s.addShape(pptx.ShapeType.rect,{x:x,y:y,w:PW,h:PH,fill:{color:'F0F0F0'},line:{color:'BBBBBB',width:1}});
            s.addText('(ใส่รูปภาพ)',{x:x,y:y+PH/2-0.2,w:PW,h:0.4,fontSize:11,align:'center',color:'999999'});
          }
          const ordTxt=it.p.order?(it.p.order+'. '):'';
          const cap=ordTxt+(it.p.code?it.p.code:'')+(it.p.code&&it.p.location?'\n':'')+(it.p.location||'');
          s.addText(cap,{x:x-0.06,y:y+PH+0.02,w:PW+0.12,h:0.55,fontSize:12,align:'center',valign:'top',color:'1a212b',fontFace:'Angsana New',bold:true,lineSpacing:13});
        });
      }
    });

    const fname='รายงานอุปกรณ์ฉุกเฉิน-'+new Date().toISOString().slice(0,10)+'.pptx';
    await pptx.writeFile({fileName:fname});
    toast('สร้าง PowerPoint สำเร็จ ('+pageNo+' สไลด์)');
  }catch(err){console.error(err);toast('เกิดข้อผิดพลาด: '+err.message);}
  finally{btn.disabled=false;btn.innerHTML=orig;}
};

try{
  render();
  if(!STORAGE_OK){
    var w=document.createElement('div');
    w.style.cssText='background:#3a2e12;color:#ffcf66;padding:10px 16px;font-size:12px;border-bottom:1px solid #5a4718;line-height:1.4';
    w.innerHTML='⚠️ ตัวเปิดนี้ไม่อนุญาตให้บันทึกถาวร — ข้อมูล/รูปจะหายเมื่อปิดหน้านี้ แนะนำให้เปิดด้วย Safari หรือ Chrome และกด “สำรองข้อมูล” ในเมนู ⋯ ก่อนปิด';
    var bar=document.querySelector('.bar');
    bar.parentNode.insertBefore(w,bar);
  }
}catch(err){
  document.getElementById('list').innerHTML='<div style="padding:30px 16px;color:#e0454e;font-size:14px">เกิดข้อผิดพลาดในการแสดงรายการ:<br>'+err.message+'</div>';
  console.error(err);
}
</script>
