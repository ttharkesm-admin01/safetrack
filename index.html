<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f6e34">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SafeTrack — รายงานตรวจอุปกรณ์ฉุกเฉิน</title>
<script>
/* Lazy-load pptxgenjs only when exporting (keeps file small for in-app browsers) */
window.__loadPptx = function(){
  return new Promise(function(resolve,reject){
    if(window.PptxGenJS){resolve(window.PptxGenJS);return;}
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js';
    // Subresource Integrity: the browser refuses to run the file unless its bytes
    // hash to exactly this value — supply-chain protection if the CDN is tampered.
    s.integrity='sha384-Cck14aA9cifjYolcnjebXRfWGkz5ltHMBiG4px/j8GS+xQcb7OhNQWZYyWjQ+UwQ';
    s.crossOrigin='anonymous';
    s.referrerPolicy='no-referrer';
    s.onload=function(){resolve(window.PptxGenJS);};
    s.onerror=function(){reject(new Error('โหลดไลบรารีไม่สำเร็จ - ต้องมีอินเทอร์เน็ตตอนกดออก PowerPoint'));};
    document.head.appendChild(s);
  });
};
</script>
<style>
:root{
  --bg:#eef1ee; --panel:#ffffff; --panel2:#f3f6f3; --line:#e2e7e3;
  --txt:#1d2a22; --mut:#6d7c72;
  --green:#188744; --green2:#0f6e34;
  --accent:#e8730f; --accent2:#1f9d6b;
  --pass:#1f9d6b; --fail:#dc3a43; --pend:#94a39a;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:"Sukhumvit Set","Noto Sans Thai",system-ui,sans-serif;font-size:15px;line-height:1.5;padding-bottom:96px}
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--green),var(--green2));border-bottom:1px solid var(--green2);padding:16px;display:flex;align-items:center;gap:12px;color:#fff;box-shadow:0 2px 10px rgba(15,110,52,.25)}
.logo{width:40px;height:40px;border-radius:11px;background:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;color:var(--green);flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.topbar h1{font-size:17px;font-weight:700;letter-spacing:.2px;color:#fff}
.topbar h1 span{color:rgba(255,255,255,.78)!important;font-weight:500;font-size:13px}
.topbar .sub{font-size:11.5px;color:rgba(255,255,255,.72);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 16px 8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;transition:border-color .15s,transform .1s;box-shadow:0 1px 3px rgba(20,50,30,.05)}
.stat:active{transform:scale(.96)}
.stat.active{border-color:var(--green);box-shadow:0 0 0 2px rgba(24,135,68,.25)}
.stat .n{font-size:21px;font-weight:800;line-height:1}
.stat .l{font-size:10.5px;color:var(--mut);margin-top:4px}
.stat.t .n{color:var(--txt)} .stat.p .n{color:var(--pass)} .stat.f .n{color:var(--fail)} .stat.d .n{color:var(--pend)}
/* progress bar */
.prog{padding:0 16px 6px}
.prog .track{height:8px;background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.prog .fill{height:100%;width:0;background:linear-gradient(90deg,var(--green),#3bbf6a);border-radius:20px;transition:width .35s ease}
.prog .pct{font-size:11px;color:var(--mut);margin-top:5px;text-align:center}
.prog .pct b{color:var(--txt)}
.empty{padding:50px 24px;text-align:center;color:var(--mut);font-size:14px}
/* storage-health banner — shown only while data is actually at risk */
.pbanner{background:#fff6e0;color:#7a5200;padding:10px 16px;font-size:12px;border-bottom:1px solid #f0dca8;line-height:1.45}
.bar{padding:0 16px 8px}
.searchwrap{position:relative}
.searchwrap input{padding-right:42px!important}
#search-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:none;border-radius:50%;background:var(--panel2);color:var(--mut);font-size:13px;cursor:pointer;display:grid;place-items:center;padding:0;font-family:inherit}
#search-clear[hidden]{display:none}
#search-clear:active{background:rgba(24,135,68,.12);color:var(--green2)}
.bar input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:12px 14px;border-radius:12px;font-size:14px;font-family:inherit;box-shadow:0 1px 3px rgba(20,50,30,.05)}
.bar input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 2px rgba(24,135,68,.18)}
.bar input::placeholder{color:var(--mut)}
.cat{margin:8px 0}
/* --topbar-h วัดจากความสูงจริงตอนรัน — หัวข้ออาจขึ้นบรรทัดใหม่บนจอแคบ ค่าคงที่จึงเพี้ยน */
.cathead{padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);position:sticky;top:var(--topbar-h,76px);z-index:10}
.cathead .ct{font-weight:700;font-size:13.5px;flex:1;color:var(--green2)}
.cathead .cn{font-size:11px;color:var(--mut);background:var(--panel2);padding:3px 9px;border-radius:20px}
.cathead .cn-ok{color:#fff;background:var(--pass)}
.cathead .cn-bad{color:#fff;background:var(--fail)}
.cathead .chev{color:var(--mut);transition:transform .2s;font-size:12px}
.cat.collapsed .chev{transform:rotate(-90deg)}
.cat.collapsed .grid{display:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;padding:11px 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 4px rgba(20,50,30,.06)}
.card.done{border-color:var(--pass)}
.card.issue{border-color:var(--fail)}
.photo{aspect-ratio:1/.72;background:var(--panel2);position:relative;display:grid;place-items:center;cursor:pointer;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .ph{color:var(--mut);font-size:11.5px;text-align:center;padding:6px}
.photo .ph svg{display:block;margin:0 auto 5px}
/* always-visible status badge (top-right) */
.photo .badge{position:absolute;top:6px;right:6px;font-size:10px;font-weight:800;padding:3px 9px 3px 7px;border-radius:20px;color:#fff;display:inline-flex;align-items:center;gap:4px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.photo .badge::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;opacity:.95}
.badge.pend{background:#d9920c}
.badge.pass{background:var(--pass)}
.badge.fail{background:var(--fail)}
.cap{padding:9px 10px 10px}
.cap .code{font-weight:800;font-size:13px;color:var(--green2)}
.cap .ord{color:var(--mut);font-weight:600}
.cap .loc{font-size:11.5px;color:var(--txt);margin-top:2px;min-height:15px}
.controls{display:flex;gap:7px;margin-top:9px}
.phactions{display:flex;gap:7px;margin-top:9px}
/* photo action buttons — green-tinted outlined */
.phactions button{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:11.5px;font-weight:700;padding:9px 0;border-radius:10px;cursor:pointer;font-family:inherit;transition:transform .08s,background .12s,border-color .12s,box-shadow .12s}
.phactions button:active{transform:scale(.94)}
.phactions button:not(.del):active{background:rgba(24,135,68,.1);border-color:var(--green)}
.phactions button.del{flex:0 0 38px;color:var(--fail);border-color:rgba(220,58,67,.4);background:rgba(220,58,67,.06)}
/* pass / fail toggle buttons */
.controls button{flex:1;border:1.5px solid var(--line);background:var(--panel2);color:var(--mut);font-size:12px;font-weight:800;padding:9px 0;border-radius:10px;cursor:pointer;font-family:inherit;transition:transform .08s,background .12s,border-color .12s,box-shadow .12s;display:flex;align-items:center;justify-content:center;gap:5px}
.controls button:active{transform:scale(.94)}
.controls button.ap{background:var(--pass);border-color:var(--pass);color:#fff;box-shadow:0 2px 8px rgba(31,157,107,.35)}
.controls button.af{background:var(--fail);border-color:var(--fail);color:#fff;box-shadow:0 2px 8px rgba(220,58,67,.35)}
/* idle-state hint tints so the user knows which is which */
.controls button:not(.ap):not(.af).pbtn{color:var(--pass);border-color:rgba(31,157,107,.35)}
.controls button:not(.ap):not(.af).fbtn{color:var(--fail);border-color:rgba(220,58,67,.35)}
.note{width:100%;margin-top:7px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 9px;font-size:11.5px;font-family:inherit;resize:none}
.fab{position:fixed;left:0;right:0;bottom:0;z-index:40;background:linear-gradient(180deg,transparent,var(--bg) 28%);padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
.fab .inner-wrap{display:flex;gap:10px;width:100%;max-width:520px}
.fab .exp{flex:1}
.fab button{flex:1;border:none;border-radius:13px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .1s,box-shadow .15s,filter .15s}
.fab button:active{transform:translateY(1px) scale(.99)}
.fab button svg{flex:0 0 auto}
/* Export PowerPoint — clean orange primary, inline white icon */
.fab .exp{padding:14px 18px;color:#fff;letter-spacing:.2px;background:linear-gradient(135deg,#ff9436,#ee7a12);box-shadow:0 6px 16px rgba(232,115,15,.36),inset 0 1px 0 rgba(255,255,255,.3)}
.fab .exp:active{filter:brightness(.97)}
/* More options — white outlined icon button */
.fab .more{flex:0 0 54px;background:#fff;color:var(--green2);border:1px solid var(--line);box-shadow:0 3px 9px rgba(20,50,30,.1)}
.fab .more:active{background:rgba(24,135,68,.06)}
.fab button[disabled]{opacity:.7;filter:saturate(.6)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:none;align-items:flex-end;backdrop-filter:blur(2px)}
.sheet.show{display:flex}
.sheet .inner{background:var(--panel);width:100%;border-radius:22px 22px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom));border-top:1px solid var(--line);box-shadow:0 -8px 30px rgba(0,0,0,.18);animation:sheetUp .22s ease}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}to{transform:translateY(0);opacity:1}}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 12px}
.sheet .shead{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.sheet .shead h3{font-size:16px;font-weight:800;color:var(--green2);flex:1}
.sheet .shead .ic{width:30px;height:30px;border-radius:9px;background:rgba(24,135,68,.12);display:grid;place-items:center;color:var(--green)}
.sheet .x{flex:0 0 32px;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--mut);font-size:16px;cursor:pointer;display:grid;place-items:center;padding:0}
.sheet .x:active{background:rgba(0,0,0,.06)}
.sheet .row{display:flex;gap:10px;margin-bottom:10px}
/* option list buttons — icon + label, left aligned */
.sheet .opt{flex:1;display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;text-align:left;transition:transform .08s,background .12s,border-color .12s}
.sheet .opt svg{flex:0 0 auto;color:var(--green)}
.sheet .opt:active{transform:scale(.985);background:rgba(24,135,68,.08);border-color:var(--green)}
.sheet .opt.danger{color:var(--fail);border-color:rgba(220,58,67,.35);background:rgba(220,58,67,.05)}
.sheet .opt.danger svg{color:var(--fail)}
.sheet .opt.on{border-color:var(--green);background:rgba(24,135,68,.1);color:var(--green2)}
/* read-only info row (storage usage) — looks like an option but isn't tappable */
.sheet .opt.info{cursor:default;font-weight:500;font-size:12.5px;color:var(--mut);background:transparent;border-style:dashed}
.sheet .opt.info:active{transform:none;background:transparent;border-color:var(--line)}
.sheet .opt.warn{color:#7a5200;border-color:#e6c67a;background:#fff6e0}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:11px 20px;border-radius:30px;font-size:13px;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:.95}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:20px}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px}
/* back-to-top */
.totop{position:fixed;right:16px;bottom:96px;z-index:35;width:44px;height:44px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);font-size:20px;display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.totop.show{display:flex}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:860px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1180px){.grid{grid-template-columns:repeat(5,1fr);max-width:1320px;margin:0 auto}}
</style>
</head>
<body>
<div id="errbox" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#e0454e;color:#fff;padding:12px 14px;font-size:12.5px;font-family:monospace;white-space:pre-wrap;word-break:break-word;max-height:60vh;overflow:auto"></div>
<script>
(function(){
  function showErr(msg){
    var b=document.getElementById('errbox');
    if(!b)return;
    b.style.display='block';
    b.textContent=(b.textContent?b.textContent+'\n\n':'')+msg;
  }
  window.onerror=function(message,source,lineno,colno,error){
    showErr('JS ERROR: '+message+'\nline '+lineno+':'+colno+(error&&error.stack?'\n'+error.stack:''));
    return false;
  };
  window.addEventListener('unhandledrejection',function(e){
    showErr('PROMISE ERROR: '+(e.reason&&e.reason.message?e.reason.message:e.reason));
  });
  // also report the browser so we know the engine
  window.addEventListener('DOMContentLoaded',function(){
    setTimeout(function(){
      var listEmpty=document.getElementById('list')&&document.getElementById('list').children.length===0;
      var total=document.getElementById('s-total');
      if(listEmpty || (total&&total.textContent==='0')){
        showErr('วินิจฉัย: รายการว่าง\nUA: '+navigator.userAgent+'\nlist children: '+(document.getElementById('list')?document.getElementById('list').children.length:'no #list')+'\nTEMPLATE_DATA: '+(typeof window.TEMPLATE_DATA!=='undefined'?(window.TEMPLATE_DATA.length+' หมวด'):'undefined (ข้อมูลไม่โหลด)'));
      }
    },1500);
  });
})();
</script>
<div class="topbar">
  <div class="logo">ST</div>
  <div style="flex:1">
    <h1>SafeTrack <span style="color:var(--mut);font-weight:500;font-size:13px">รายงานตรวจอุปกรณ์</span></h1>
    <div class="sub">EF-SF-002 · ระบบบันทึก + ออกรายงาน PowerPoint</div>
  </div>
</div>

<div class="stats">
  <div class="stat t" data-filter="all"><div class="n" id="s-total">0</div><div class="l">ทั้งหมด</div></div>
  <div class="stat d" data-filter="pending"><div class="n" id="s-pend">0</div><div class="l">ยังไม่ตรวจ</div></div>
  <div class="stat p" data-filter="pass"><div class="n" id="s-pass">0</div><div class="l">ปกติ</div></div>
  <div class="stat f" data-filter="fail"><div class="n" id="s-fail">0</div><div class="l">ไม่ปกติ</div></div>
</div>

<div class="prog">
  <div class="track"><div class="fill" id="prog-fill"></div></div>
  <div class="pct" id="prog-pct">ตรวจแล้ว <b>0</b> จาก <b>0</b> จุด</div>
</div>

<div class="bar"><div class="searchwrap"><input id="search" placeholder="ค้นหา รหัส / ตำแหน่ง / ประเภท…"><button id="search-clear" aria-label="ล้างคำค้นหา" hidden>✕</button></div></div>

<div id="list"></div>

<div class="fab">
  <div class="inner-wrap">
    <button class="exp" id="btn-export">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="12" rx="2" stroke="#fff" stroke-width="2"/><path d="M12 16v3m-3 0h6" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M7 12l2.5-2.5L12 11l3.5-4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      ออก PowerPoint
    </button>
    <button class="more" id="btn-more" aria-label="ตัวเลือกเพิ่มเติม">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 7h9M5 12h14M5 17h6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="17.5" cy="7" r="2.2" fill="currentColor"/><circle cx="9.5" cy="17" r="2.2" fill="currentColor"/></svg>
    </button>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="inner">
    <div class="grab"></div>
    <div class="shead">
      <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="2"/><path d="M19.4 13a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-2.9 1.2v.1a2 2 0 11-4 0v-.1A1.7 1.7 0 005 17.9l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00-1.2-2.9H1a2 2 0 110-4h.1A1.7 1.7 0 002.3 5l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H7a1.7 1.7 0 001-1.5V1a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V7a1.7 1.7 0 001.5 1H23a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z" stroke="currentColor" stroke-width="1.6"/></svg></span>
      <h3>ตัวเลือกเพิ่มเติม</h3>
      <button class="x" id="opt-close" aria-label="ปิด">✕</button>
    </div>
    <div class="row"><button class="opt on" id="opt-autonext"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12h13m0 0l-5-5m5 5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>เลื่อนไปจุดถัดไปอัตโนมัติ (Auto Next)</button></div>
    <div class="row"><button class="opt" id="opt-onlyphoto"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="10" r="1.5" fill="currentColor"/><path d="M21 16l-5-5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>เลือกออกเฉพาะจุดที่มีรูป</button></div>
    <div class="row"><button class="opt" id="opt-collapse"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M8 4h13M8 10h13M8 16h13M3 4l2 2-2 2M3 14l2 2-2 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>ยุบ / ขยายทุกหมวด</button></div>
    <div class="row">
      <button class="opt" id="opt-backup"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>สำรองข้อมูล</button>
      <button class="opt" id="opt-restore"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 21V9m0 0l-4 4m4-4l4 4M4 7V5a2 2 0 012-2h12a2 2 0 012 2v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>กู้คืนข้อมูล</button>

function dataURLToBlob(d){const i=d.indexOf(',');const mime=(d.slice(5,i).split(';')[0])||'image/jpeg';const bin=atob(d.slice(i+1));const u8=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)u8[j]=bin.charCodeAt(j);return new Blob([u8],{type:mime});}

function makeFileObj(blob,name){return new File([blob],name,{type:blob.type||'application/octet-stream'});}

// ---- ZIP (โหมด STORE ไม่บีบอัด) — ใช้กับไฟล์สำรองข้อมูล ----
// เขียนเองเพราะไม่มี build step และไฟล์สำรอง "ต้อง" ทำงานตอนออฟไลน์ได้ จึงโหลดไลบรารีจาก CDN ไม่ได้
// JPEG บีบอัดมาแล้ว STORE จึงไม่เสียอะไร และตัด base64 ที่เคยทำให้ไฟล์โต 33% ทิ้งไปด้วย
const CRC_TABLE=(function(){const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}
  return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_TABLE[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipBuf(len){const b=new Uint8Array(len);let o=0;return{b:b,
  w16:function(v){b[o++]=v&255;b[o++]=(v>>>8)&255;},
  w32:function(v){b[o++]=v&255;b[o++]=(v>>>8)&255;b[o++]=(v>>>16)&255;b[o++]=(v>>>24)&255;},
  raw:function(x){b.set(x,o);o+=x.length;}};}
// entries: [{name, blob}] — อ่าน blob ทีละใบเพื่อคิด CRC แล้วปล่อยทิ้ง
// ตัว Blob ใส่เข้า new Blob([...]) โดยอ้างอิง ไม่เคยกองรวมกันในแรม
async function makeZip(entries,onProgress){
  const parts=[],central=[];let offset=0;const d=new Date();
  const dTime=((d.getHours()<<11)|(d.getMinutes()<<5)|((d.getSeconds()/2)|0))&0xFFFF;
  const dDate=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  for(let i=0;i<entries.length;i++){
    const e=entries[i],name=new TextEncoder().encode(e.name);
    const u8=new Uint8Array(await e.blob.arrayBuffer());
    const crc=crc32(u8),size=u8.length;
    const lh=zipBuf(30+name.length);
    lh.w32(0x04034b50);lh.w16(20);lh.w16(0x0800);lh.w16(0);   // 0x0800 = ชื่อไฟล์เป็น UTF-8
    lh.w16(dTime);lh.w16(dDate);lh.w32(crc);lh.w32(size);lh.w32(size);
    lh.w16(name.length);lh.w16(0);lh.raw(name);
    parts.push(lh.b,e.blob);
    const ch=zipBuf(46+name.length);
    ch.w32(0x02014b50);ch.w16(20);ch.w16(20);ch.w16(0x0800);ch.w16(0);
    ch.w16(dTime);ch.w16(dDate);ch.w32(crc);ch.w32(size);ch.w32(size);
    ch.w16(name.length);ch.w16(0);ch.w16(0);ch.w16(0);ch.w16(0);ch.w32(0);ch.w32(offset);
    ch.raw(name);
    central.push(ch.b);
    offset+=lh.b.length+size;
    if(onProgress)onProgress(i+1,entries.length);
  }
  const cdSize=central.reduce(function(n,c){return n+c.length;},0);
  const eo=zipBuf(22);
  eo.w32(0x06054b50);eo.w16(0);eo.w16(0);
  eo.w16(entries.length);eo.w16(entries.length);eo.w32(cdSize);eo.w32(offset);eo.w16(0);
  return new Blob(parts.concat(central,[eo.b]),{type:'application/zip'});
}
// อ่านเฉพาะสารบัญ — เนื้อของแต่ละ entry คืนเป็น Blob slice ซึ่งเป็น "มุมมอง" ไม่ใช่สำเนา
// ไฟล์สำรองขนาด 100MB จึงไม่เคยถูกโหลดเข้าแรมทั้งก้อน
async function readZip(file){
  if(file.size<22)throw new Error('ไฟล์เล็กเกินกว่าจะเป็น ZIP');
  const tailLen=Math.min(file.size,66000);
  const tail=new Uint8Array(await file.slice(file.size-tailLen).arrayBuffer());
  let p=-1;
  for(let i=tail.length-22;i>=0;i--)
    if(tail[i]===0x50&&tail[i+1]===0x4b&&tail[i+2]===0x05&&tail[i+3]===0x06){p=i;break;}
  if(p<0)throw new Error('หาสารบัญของไฟล์ ZIP ไม่เจอ (ไฟล์อาจไม่ครบ)');
  const dv=new DataView(tail.buffer,tail.byteOffset);
  const count=dv.getUint16(p+10,true),cdSize=dv.getUint32(p+12,true),cdOff=dv.getUint32(p+16,true);
  if(cdOff+cdSize>file.size)throw new Error('ไฟล์ ZIP ไม่ครบ (สารบัญชี้เกินขนาดไฟล์)');
  const cd=new Uint8Array(await file.slice(cdOff,cdOff+cdSize).arrayBuffer());
  const cv=new DataView(cd.buffer,cd.byteOffset);
  const out=[];let o=0;
  for(let i=0;i<count;i++){
    if(o+46>cd.length||cv.getUint32(o,true)!==0x02014b50)throw new Error('สารบัญของไฟล์ ZIP เสียหาย');
    const crc=cv.getUint32(o+16,true),size=cv.getUint32(o+24,true);
    const nL=cv.getUint16(o+28,true),xL=cv.getUint16(o+30,true),cL=cv.getUint16(o+32,true);
    const lho=cv.getUint32(o+42,true);
    out.push({name:new TextDecoder().decode(cd.subarray(o+46,o+46+nL)),crc:crc,size:size,lho:lho});
    o+=46+nL+xL+cL;
  }
  for(const e of out){
    const lh=new Uint8Array(await file.slice(e.lho,e.lho+30).arrayBuffer());
    if(lh.length<30)throw new Error('ไฟล์ ZIP ไม่ครบ');
    const lv=new DataView(lh.buffer,lh.byteOffset);
    if(lv.getUint32(0,true)!==0x04034b50)throw new Error('หัวข้อมูลใน ZIP เสียหาย');
    const start=e.lho+30+lv.getUint16(26,true)+lv.getUint16(28,true);
    if(start+e.size>file.size)throw new Error('ไฟล์ ZIP ไม่ครบ (ข้อมูลถูกตัดกลางคัน)');
    e.blob=file.slice(start,start+e.size);
    e.map=null;
  }
  return out;
}
async function zipEntryBlob(e){   // อ่านทีละใบพร้อมตรวจ CRC เพื่อจับไฟล์ที่เสีย
  const u8=new Uint8Array(await e.blob.arrayBuffer());
  if(crc32(u8)!==e.crc)throw new Error('ข้อมูลในไฟล์สำรองเสียหาย ('+e.name+')');
  return new Blob([u8],{type:/\.jpe?g$/i.test(e.name)?'image/jpeg':'application/octet-stream'});
}

}

// ---- photo ops ----
// รูปทั้งชุดคือ ~40–80MB จึงถือ object URL ไว้แค่ไม่กี่ใบ แล้วโหลดที่เหลือจาก IDB เมื่อเลื่อนถึง
const MAX_LIVE_URL=30;
const lru=[];              // uid เรียงจากใช้เก่าสุด -> ล่าสุด
const visible=new Set();   // uid ที่การ์ดอยู่ในจอตอนนี้ — ห้ามถอด URL ทิ้ง
function touchLRU(id){
  const i=lru.indexOf(id);if(i>=0)lru.splice(i,1);
  lru.push(id);trimLRU();
}
function trimLRU(){
  for(let i=0;i<lru.length&&lru.length>MAX_LIVE_URL;){
    const id=lru[i];
    if(visible.has(id)){i++;continue;}   // ยังอยู่ในจอ ข้ามไปตัวถัดไป
    lru.splice(i,1);releaseURL(id);
  }
  sweepBlobCache();
}
// blob ที่ cache ไว้ตอนถ่ายรูปจะค้างถ้าการ์ดนั้นไม่เคยถูกเลื่อนมาแสดง (เช่นโดนตัวกรองซ่อนไว้)
function sweepBlobCache(){
  if(!idbOK)return;   // โหมด fallback: photoBlob คือที่เก็บจริง ห้ามล้าง
  for(const id in photoBlob){if(!photoURL[id]&&!visible.has(id))delete photoBlob[id];}
}
function releaseURL(id){
  if(!photoURL[id])return;
  URL.revokeObjectURL(photoURL[id]);delete photoURL[id];
  if(idbOK)delete photoBlob[id];        // fallback mode ต้องเก็บ blob ไว้ ไม่มีที่อื่นให้อ่านซ้ำ
  const img=document.querySelector('.photo[data-id="'+id+'"] img');
  if(img)img.removeAttribute('src');     // เลื่อนกลับมาเมื่อไหร่ observer จะโหลดใหม่เอง
}
async function ensurePhotoURL(id){
  if(photoURL[id]){touchLRU(id);return photoURL[id];}
  if(!photoKeys.has(id))return null;
  let b=photoBlob[id];
  if(!b&&idbOK){try{b=await idbGet(STABLE[id]);}catch(e){b=null;}}
  if(!(b instanceof Blob))return null;
  if(idbOK)delete photoBlob[id];         // object URL ถือ blob ไว้เองแล้ว ไม่ต้องเก็บซ้ำ
  photoURL[id]=URL.createObjectURL(b);touchLRU(id);
  return photoURL[id];
}
// อ่าน blob โดยไม่แตะ LRU — ใช้ตอน export/backup ที่วนทีละใบแล้วปล่อยทิ้งทันที
async function readPhotoBlob(id){
  if(photoBlob[id])return photoBlob[id];
  if(!idbOK||!photoKeys.has(id))return null;
  try{const b=await idbGet(STABLE[id]);return (b instanceof Blob)?b:null;}catch(e){return null;}
}
// cache=true ให้เก็บ blob ไว้ในแรมเพื่อแสดงผลทันที (ตอนผู้ใช้เพิ่งถ่ายรูป)
async function setPhoto(id,blob,cache){
  releaseURL(id);photoKeys.add(id);
  if(idbOK){
    try{
      await idbPut(STABLE[id],blob);
      if(cache)photoBlob[id]=blob;
      if(!photoPersistOK){photoPersistOK=true;updatePersistBanner();}
    }catch(e){
      photoBlob[id]=blob;   // เซฟลงดิสก์ไม่ได้ อย่างน้อยยังอยู่ในแรมให้สำรองข้อมูลออกไปได้
      photoPersistOK=false;updatePersistBanner();
      toast(e&&e.name==='QuotaExceededError'?'⚠️ พื้นที่เก็บรูปเต็ม — กรุณาสำรองข้อมูลแล้วล้างข้อมูลเก่า':'⚠️ เซฟรูปลงเครื่องไม่สำเร็จ — กรุณาสำรองข้อมูล');
    }
  }else{
    photoBlob[id]=blob;photoPersistOK=false;
  }
}
async function delPhoto(id){
  releaseURL(id);
  delete photoBlob[id];photoKeys.delete(id);
  const i=lru.indexOf(id);if(i>=0)lru.splice(i,1);
  if(idbOK){try{await idbDel(STABLE[id]);}catch(e){}}
}

// ---- load + one-time migration from the old localStorage blob ----
async function loadAll(){
  // 1) new-format metadata — sid ที่ไม่รู้จักเก็บเข้า orphanMeta แทนที่จะทิ้ง
  try{
    const raw=lsGet(META_KEY);
    if(raw){const sm=JSON.parse(raw)||{};
      for(const sid in sm){const u=STABLE2UID[sid];if(u)meta[u]=sm[sid];else orphanMeta[sid]=sm[sid];}}
  }catch(e){}
  // 2) photos: อ่านแค่รายชื่อคีย์ ตัว Blob โหลดทีหลังเมื่อการ์ดเลื่อนเข้ามาในจอ
  if(idbOK){
    orphanPhotoKeys=[];
    (await idbAllKeys()).forEach(function(k){
      const u=STABLE2UID[k];
      if(u)photoKeys.add(u);else orphanPhotoKeys.push(k);
    });
  }
  // 3) fold in any leftover legacy data (never overwrites newer values)
  if(lsGet(OLD_KEY))await migrateOld();
}
async function migrateOld(){
  let old;try{old=JSON.parse(lsGet(OLD_KEY)||'{}')||{};}catch(e){return;}
  let photoFail=false,moved=0;
  for(const u in old){
    if(!/^s\d+p\d+$/.test(u)||!(u in STABLE))continue;
    const o=old[u]||{};
    if(!(u in meta)){const m={};if(o.result)m.result=o.result;if(o.note)m.note=o.note;if(m.result||m.note)meta[u]=m;}
    if(!photoKeys.has(u)&&typeof o.photo==='string'&&o.photo.indexOf('data:')===0){
      try{
        const b=dataURLToBlob(o.photo);
        if(idbOK){await idbPut(STABLE[u],b);photoKeys.add(u);moved++;}
        else{photoBlob[u]=b;photoKeys.add(u);photoFail=true;}
      }catch(e){photoFail=true;}
    }
  }
  saveMeta();
  // only drop the legacy blob once its photos are safely in IndexedDB
  if(idbOK&&!photoFail){try{if(STORAGE_OK)window.localStorage.removeItem(OLD_KEY);}catch(e){}}
  if(moved)toast('อัปเกรดข้อมูลเดิมเรียบร้อย');
}

async function clearAll(silent){
  meta={};orphanMeta={};
  Object.keys(photoURL).forEach(function(u){URL.revokeObjectURL(photoURL[u]);delete photoURL[u];});
  Object.keys(photoBlob).forEach(function(u){delete photoBlob[u];});
  photoKeys.clear();lru.length=0;visible.clear();orphanPhotoKeys=[];
  if(idbOK){try{await idbClear();}catch(e){}}
  clearTimeout(_metaT);_metaT=null;saveMeta();
  if(!silent){render();refreshStorageInfo();toast('ล้างข้อมูลแล้ว');}
}

function gotoNext(curId){
  const i=FLAT_IDS.indexOf(curId);if(i<0)return;
  for(let j=i+1;j<FLAT_IDS.length;j++){
    const el=document.querySelector('.photo[data-id="'+FLAT_IDS[j]+'"]');
    if(!el)continue;
    const card=el.closest('.card'),cat=el.closest('.cat');
    // การ์ดอยู่ใน .grid ที่ display:none ถ้าหมวดถูกยุบ — scrollIntoView จะเงียบสนิท ต้องกางก่อน
    if(cat&&cat.classList.contains('collapsed')){
      cat.classList.remove('collapsed');
      collapsedCats.delete(+cat.dataset.si);saveSettings();
    }
    card.scrollIntoView({behavior:'smooth',block:'center'});
    card.style.transition='box-shadow .3s';card.style.boxShadow='0 0 0 2px var(--green)';
    setTimeout(function(){card.style.boxShadow='';},900);return;
  }
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}

// ---- lazy photo loading: only cards on (or near) screen hold a decoded image ----
let io=null;
function setupIO(){
  if(!window.IntersectionObserver)return;
  io=new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      const id=en.target.dataset.id;if(!id)return;
      if(en.isIntersecting){visible.add(id);loadPhotoInto(en.target);}
      else{visible.delete(id);}
    });
    trimLRU();
  },{rootMargin:'400px 0px'});
}
function observeCards(scope){
  const nodes=(scope||document).querySelectorAll('.photo[data-id]');
  if(io){nodes.forEach(function(el){io.observe(el);});return;}
  nodes.forEach(function(el){visible.add(el.dataset.id);loadPhotoInto(el);}); // เบราว์เซอร์เก่า: โหลดทั้งหมด
}
async function loadPhotoInto(ph){
  const id=ph.dataset.id;
  if(!photoKeys.has(id))return;
  const img=ph.querySelector('img');
  if(!img||img.getAttribute('src'))return;
  const u=await ensurePhotoURL(id);
  if(u&&!img.getAttribute('src'))img.src=u;
}
// targeted updates — avoid rebuilding the whole 195-card list on every tap
function rerenderCard(id){
  const ph=document.querySelector('.photo[data-id="'+id+'"]');if(!ph)return false;
  const card=ph.closest('.card');const m=/^s(\d+)p(\d+)$/.exec(id);if(!m)return false;
  if(io)io.unobserve(ph);
  const cd=cardHTML(+m[1],+m[2]);card.className=cd.cls;card.innerHTML=cd.inner;
  observeCards(card);
  return true;
}
function refreshCatHead(si){const h=document.querySelector('.cat[data-si="'+si+'"] .cathead');if(h)h.innerHTML=catHeadHTML(si);}
function refreshStats(){
  let tot=0,pass=0,fail=0;
  TEMPLATE_DATA.forEach((cat,si)=>cat.points.forEach((p,pi)=>{tot++;const st=meta[uid(si,pi)]||{};if(st.result==='pass')pass++;else if(st.result==='fail')fail++;}));
  const done=pass+fail,pend=tot-done;
  document.getElementById('s-total').textContent=tot;
  document.getElementById('s-pend').textContent=pend;
  document.getElementById('s-pass').textContent=pass;
  document.getElementById('s-fail').textContent=fail;
  const pctVal=tot?Math.round(done/tot*100):0;
  document.getElementById('prog-fill').style.width=pctVal+'%';
  document.getElementById('prog-pct').innerHTML='ตรวจแล้ว <b>'+done+'</b> จาก <b>'+tot+'</b> จุด ('+pctVal+'%)';
  document.querySelectorAll('.stat').forEach(s=>s.classList.toggle('active',s.dataset.filter===activeFilter));
}
function isFiltered(){return activeFilter!=='all'||((document.getElementById('search').value||'').trim()!=='');}

function render(){
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  const list=document.getElementById('list');
  if(io)io.disconnect();      // การ์ดเดิมกำลังจะถูกทิ้ง อย่าให้ observer ค้างอ้างถึง
  visible.clear();
  list.innerHTML='';
  let shown=0;
  TEMPLATE_DATA.forEach((cat,si)=>{
    const matchPts=cat.points.map((p,pi)=>({p,pi})).filter(({p,pi})=>{
      const st=meta[uid(si,pi)]||{};
      if(activeFilter==='pending'&&st.result)return false;
      if(activeFilter==='pass'&&st.result!=='pass')return false;
      if(activeFilter==='fail'&&st.result!=='fail')return false;
      if(!q)return true;
      return (String(p.code)+' '+String(p.location)+' '+cat.category).toLowerCase().includes(q);
    });
    if(matchPts.length===0)return;
    shown+=matchPts.length;
    const wrap=document.createElement('div');wrap.className='cat'+(collapsedCats.has(si)?' collapsed':'');wrap.dataset.si=si;
    wrap.innerHTML='<div class="cathead">'+catHeadHTML(si)+'</div><div class="grid"></div>';
    const grid=wrap.querySelector('.grid');
    matchPts.forEach(({p,pi})=>{
      const cd=cardHTML(si,pi);
      const card=document.createElement('div');card.className=cd.cls;card.innerHTML=cd.inner;
      grid.appendChild(card);
    });
    list.appendChild(wrap);
  });
  refreshStats();
  if(shown===0){
    const msg=q?'ไม่พบรายการที่ค้นหา':(activeFilter==='pending'?'ตรวจครบทุกจุดแล้ว 🎉':'ไม่มีรายการในตัวกรองนี้');
    list.innerHTML='<div class="empty">'+esc(msg)+'</div>';
  }else observeCards(list);
  trimLRU();
}

// delegated events
document.getElementById('list').addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,id=el.dataset.id;
  if(act==='gallery'){pickPhoto(id,false);}
  else if(act==='camera'){pickPhoto(id,true);}
  else if(act==='view'){ensurePhotoURL(id).then(function(u){if(u){document.getElementById('lb-img').src=u;document.getElementById('lightbox').classList.add('show');}});}
  else if(act==='delphoto'){if(confirm('ลบรูปนี้?')){delPhoto(id).then(()=>{if(isFiltered())render();else if(!rerenderCard(id))render();});}}
  else if(act==='pass'||act==='fail'){
    meta[id]=meta[id]||{};
    const wasSet=meta[id].result===act;
    meta[id].result=wasSet?null:act;
    saveMeta();
    const mm=/^s(\d+)p/.exec(id);
    if(isFiltered()){render();}
    else{rerenderCard(id);if(mm)refreshCatHead(+mm[1]);refreshStats();}
    if(autoNext && !wasSet){requestAnimationFrame(()=>gotoNext(id));}
  }
});
document.getElementById('list').addEventListener('click',e=>{

  if(nowCollapsed)collapsedCats.add(si);else collapsedCats.delete(si);

// Resize to a JPEG Blob. createImageBitmap({imageOrientation:'from-image'}) bakes in
// EXIF rotation — phones tag portrait shots, and drawing a raw <img> to canvas would
// otherwise lose that and export sideways photos.
function resizeImageToBlob(file,maxW,quality){
  return new Promise(function(resolve,reject){
    function paint(src,w,h){
      let tw=w,th=h;if(tw>maxW){th=Math.round(th*maxW/tw);tw=maxW;}
      const c=document.createElement('canvas');c.width=tw;c.height=th;
      c.getContext('2d').drawImage(src,0,0,tw,th);
      if(src.close)src.close();
      if(c.toBlob)c.toBlob(function(b){b?resolve(b):reject(new Error('แปลงรูปไม่สำเร็จ'));},'image/jpeg',quality);
      else{try{resolve(dataURLToBlob(c.toDataURL('image/jpeg',quality)));}catch(e){reject(e);}}
    }
    function fallback(){
      const img=new Image();const rd=new FileReader();
      img.onerror=function(){reject(new Error('ไฟล์รูปไม่ถูกต้อง'));};
      rd.onerror=function(){reject(new Error('อ่านไฟล์ไม่สำเร็จ'));};
      rd.onload=function(){img.onload=function(){paint(img,img.naturalWidth||img.width,img.naturalHeight||img.height);};img.src=rd.result;};
      rd.readAsDataURL(file);
    }
    if(window.createImageBitmap){
      createImageBitmap(file,{imageOrientation:'from-image'})
        .then(function(bmp){paint(bmp,bmp.width,bmp.height);})
        .catch(fallback);
    }else fallback();
  });
}

function applyMetaMap(m){        // stable id -> {result,note}; sid ที่ไม่รู้จักเก็บเป็น orphan
  for(const sid in m){const u=STABLE2UID[sid],v=m[sid];
    if(!v||typeof v!=='object')continue;
    if(u)meta[u]={result:v.result||null,note:typeof v.note==='string'?v.note:''};
    else orphanMeta[sid]=v;}       // ไฟล์สำรองอาจมาจาก template คนละรุ่น — เก็บไว้ทั้งหมด
}
async function storePhotoBySid(sid,blob){
  const u=STABLE2UID[sid];
  if(u)await setPhoto(u,blob);
  else if(idbOK){try{await idbPut(sid,blob);orphanPhotoKeys.push(sid);}catch(e){}}
}

document.getElementById('restore-file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const btn=document.getElementById('opt-restore'),orig=btn.innerHTML;
  try{
    const magic=new Uint8Array(await f.slice(0,4).arrayBuffer());
    const isZip=magic[0]===0x50&&magic[1]===0x4b&&magic[2]===0x03&&magic[3]===0x04;

    if(isZip){
      // อ่านสารบัญ + meta.json ให้ผ่านก่อน แล้วค่อยยืนยัน/ล้างของเดิม
      // ถ้าไฟล์เสีย ผู้ใช้ต้องไม่เสียข้อมูลที่มีอยู่ไปด้วย
      const zip=await readZip(f);
      const metaEntry=zip.find(function(z){return z.name==='meta.json';});
      if(!metaEntry)throw new Error('ไม่พบ meta.json ในไฟล์สำรอง');
      const manifest=JSON.parse(await (await zipEntryBlob(metaEntry)).text());
      if(!manifest||manifest.app!=='safetrack-ef002')throw new Error('ไม่ใช่ไฟล์สำรองของ SafeTrack');
      const photos=Array.isArray(manifest.photos)?manifest.photos:[];
      if(!confirm('การกู้คืนจะเขียนทับข้อมูลปัจจุบันทั้งหมด ดำเนินการต่อหรือไม่?\n(ไฟล์นี้มีรูป '+photos.length+' รูป)'))return;

      btn.disabled=true;
      await clearAll(true);
      applyMetaMap(manifest.meta&&typeof manifest.meta==='object'?manifest.meta:{});
      const byName={};zip.forEach(function(z){byName[z.name]=z;});
      let n=0;
      for(const p of photos){
        const z=p&&byName[p.file];
        if(!z||typeof p.id!=='string')continue;
        btn.innerHTML='กำลังกู้คืน… '+(++n)+'/'+photos.length;
        await storePhotoBySid(p.id,await zipEntryBlob(z));  // ทีละใบ แรมไม่บานตามขนาดไฟล์
      }
    }else{
      // ไฟล์สำรองรูปแบบเดิม (v2 และ legacy) — ต้องกู้คืนได้เสมอ
      if(!confirm('การกู้คืนจะเขียนทับข้อมูลปัจจุบันทั้งหมด ดำเนินการต่อหรือไม่?'))return;
      const o=JSON.parse(await f.text());
      if(!o||typeof o!=='object')throw new Error('โครงสร้างไฟล์ไม่ถูกต้อง');
      btn.disabled=true;
      await clearAll(true);
      if(o.version===2&&o.meta&&typeof o.meta==='object'){
        applyMetaMap(o.meta);
        if(o.photos&&typeof o.photos==='object'){
          for(const sid in o.photos){const d=o.photos[sid];
            if(typeof d!=='string'||d.indexOf('data:')!==0)continue;
            await storePhotoBySid(sid,dataURLToBlob(d));}
        }
      }else{
        // legacy backup: positional keys with inline .photo dataURLs
        for(const u in o){if(!/^s\d+p\d+$/.test(u)||!(u in STABLE))continue;const it=o[u]||{};const mm={};if(it.result)mm.result=it.result;if(typeof it.note==='string')mm.note=it.note;if(mm.result||mm.note)meta[u]=mm;if(typeof it.photo==='string'&&it.photo.indexOf('data:')===0)await setPhoto(u,dataURLToBlob(it.photo));}
      }
    }
    saveMeta();render();refreshStorageInfo();sheet.classList.remove('show');toast('กู้คืนข้อมูลแล้ว');
  }catch(err){toast('ไฟล์ไม่ถูกต้อง: '+(err&&err.message||err));}
  finally{btn.disabled=false;btn.innerHTML=orig;}
};

// ====== EXPORT POWERPOINT ======
document.getElementById('btn-export').onclick=async function(){
  const btn=this;btn.disabled=true;const orig=btn.innerHTML;btn.innerHTML='กำลังสร้าง…';
  try{
    btn.innerHTML='กำลังโหลด…';
    const PGJS = await window.__loadPptx();
    if(!PGJS){throw new Error('ไลบรารี PowerPoint ยังไม่พร้อม');}
    btn.innerHTML='กำลังสร้าง…';
    const pptx=new PGJS();
    pptx.defineLayout({name:'W',width:13.333,height:7.5});
    pptx.layout='W';
    const PER=14, COLS=7, ROWS=2;
    const PW=1.78, PH=1.65;          // photo size (in)
    const GAPX=(13.333-0.14-COLS*PW)/(COLS-1); // distribute
    const x0=0.07, yTop=1.77, yBot=4.10;
    const rowY=[yTop,yBot];
    // เลขหน้าไม่ประทับตอนนี้ — ตารางสรุปใช้ autoPage ซึ่ง pptxgenjs แตกสไลด์เพิ่มเอง
    // ถ้านับเองระหว่างทางจะเพี้ยนทั้งเล่ม (ดู stampPageNumbers ตอนท้าย)

    // ===== SUMMARY TABLE SLIDE (first page) =====
    const sum=pptx.addSlide();
    sum.background={color:'FFFFFF'};
    sum.addText('รายงานผลการดำเนินงานงานหน่วยงาน',{x:0.44,y:0.10,w:12.45,h:0.55,fontSize:24,bold:true,align:'center',color:'1a212b',fontFace:'Angsana New'});
    sum.addText('สรุปผลการตรวจสอบอุปกรณ์ความปลอดภัยและอุปกรณ์ฉุกเฉิน (EF-SF-002)',{x:0.44,y:0.72,w:12.45,h:0.6,fontSize:22,bold:true,align:'center',color:'c0392b',fontFace:'Angsana New'});

    // build rows: one per category, count ปกติ/ไม่ปกติ, collect ไม่ปกติ notes
    const headFill={color:'FF0000'};
    const rows=[[
      {text:'อุปกรณ์ที่ตรวจ',options:{bold:true,color:'FFFFFF',fill:headFill,align:'center',valign:'middle',fontFace:'Angsana New',fontSize:16}},
      {text:'จำนวนที่มี',options:{bold:true,color:'FFFFFF',fill:headFill,align:'center',valign:'middle',fontFace:'Angsana New',fontSize:16}},
      {text:'ปกติ',options:{bold:true,color:'FFFFFF',fill:headFill,align:'center',valign:'middle',fontFace:'Angsana New',fontSize:16}},
      {text:'ไม่ปกติ',options:{bold:true,color:'FFFFFF',fill:headFill,align:'center',valign:'middle',fontFace:'Angsana New',fontSize:16}},
      {text:'อธิบายสภาพที่ไม่ปกติ',options:{bold:true,color:'FFFFFF',fill:headFill,align:'center',valign:'middle',fontFace:'Angsana New',fontSize:16}}
    ]];
    // merge categories with same name (template repeats some) — group by category text
    const catMap={};const catOrder=[];
    TEMPLATE_DATA.forEach((cat,si)=>{
      const name=cat.category.trim();
      if(!catMap[name]){catMap[name]={total:0,ok:0,bad:0,notes:[]};catOrder.push(name);}
      cat.points.forEach((p,pi)=>{
        catMap[name].total++;
        const st=meta[uid(si,pi)]||{};
        if(st.result==='pass')catMap[name].ok++;
        if(st.result==='fail'){catMap[name].bad++;
          const label=(p.code||p.location||('จุดที่ '+(pi+1)));
          catMap[name].notes.push(label+(st.note?(': '+st.note):''));
        }
      });
    });
    catOrder.forEach(name=>{
      const c=catMap[name];
      const cell=(t,al)=>({text:String(t),options:{align:al||'center',valign:'middle',fontFace:'Angsana New',fontSize:13,color:'1a212b'}});
      rows.push([
        {text:name,options:{align:'left',valign:'middle',fontFace:'Angsana New',fontSize:13,bold:true,color:'1a212b'}},
        cell(c.total),
        cell(c.ok),
        cell(c.bad>0?c.bad:''),
        {text:c.notes.join('\n'),options:{align:'left',valign:'middle',fontFace:'Angsana New',fontSize:12,color:'c0392b'}}
      ]);
    });
    sum.addTable(rows,{
      x:0.3,y:1.5,w:12.7,
      colW:[4.06,1.74,1.29,0.95,4.66],
      border:{type:'solid',color:'888888',pt:1},
      valign:'middle',
      autoPage:true,autoPageRepeatHeader:true,autoPageLineWeight:-0.5,
      newSlideStartY:1.0
    });

    // ===== PER-POINT PHOTO SLIDES =====
    // รวบรวมรายการก่อน เพื่อรู้ยอดรวมไว้แสดงความคืบหน้าบนปุ่ม
    const groups=[];
    for(let si=0; si<TEMPLATE_DATA.length; si++){
      const cat=TEMPLATE_DATA[si];
      const items=cat.points.map((p,pi)=>({p:p,id:uid(si,pi)}))
        .filter(it=> onlyPhotoExport ? photoKeys.has(it.id) : true);
      if(items.length===0 && onlyPhotoExport) continue;
      groups.push({cat:cat,items:items});
    }
    const totalPts=groups.reduce((n,g)=>n+g.items.length,0);
    let donePts=0;

    for(const g of groups){
      const cat=g.cat, items=g.items;
      for(let off=0; off<Math.max(items.length,1); off+=PER){
        const chunk=items.slice(off,off+PER);
        const s=pptx.addSlide();
        s.background={color:'FFFFFF'};
        s.addText('รายงานผลการดำเนินงานงานหน่วยงาน',{x:0.44,y:0.10,w:12.45,h:0.55,fontSize:24,bold:true,align:'center',color:'1a212b',fontFace:'Angsana New'});
        s.addText(cat.category,{x:0.44,y:0.75,w:12.45,h:0.7,fontSize:26,bold:true,align:'center',color:'c0392b',fontFace:'Angsana New'});
        for(let k=0;k<chunk.length;k++){
          btn.innerHTML='กำลังสร้าง… '+(++donePts)+'/'+totalPts;
          // คืนคิวให้เบราว์เซอร์เป็นระยะ ไม่งั้นข้อความความคืบหน้าไม่ถูกวาดจนกว่าจะจบทั้งลูป
          if(donePts%5===0)await new Promise(function(r){setTimeout(r,0);});
          const it=chunk[k];
          const col=k%COLS, row=Math.floor(k/COLS);
          const x=x0+col*(PW+GAPX), y=rowY[row];
          const pb=await readPhotoBlob(it.id);   // อ่านทีละใบจาก IDB แล้วปล่อยทิ้ง ไม่ถือทั้งชุดไว้ในแรม
          if(pb){
            const dataUrl=await blobToDataURL(pb);
            s.addImage({data:dataUrl,x:x,y:y,w:PW,h:PH});
          }else{
            s.addShape(pptx.ShapeType.rect,{x:x,y:y,w:PW,h:PH,fill:{color:'F0F0F0'},line:{color:'BBBBBB',width:1}});
            s.addText('(ใส่รูปภาพ)',{x:x,y:y+PH/2-0.2,w:PW,h:0.4,fontSize:11,align:'center',color:'999999'});
          }
          const ordTxt=it.p.order?(it.p.order+'. '):'';
          const cap=ordTxt+(it.p.code?it.p.code:'')+(it.p.code&&it.p.location?'\n':'')+(it.p.location||'');
          s.addText(cap,{x:x-0.06,y:y+PH+0.02,w:PW+0.12,h:0.55,fontSize:12,align:'center',valign:'top',color:'1a212b',fontFace:'Angsana New',bold:true,lineSpacing:13});
        }
      }
    }

    // ประทับเลขหน้าตอนนี้ที่เดียว — ตอนนี้เท่านั้นที่รู้จำนวนสไลด์จริง รวมสไลด์ที่ autoPage แตกเอง
    const slides=pptx.slides||[];
    slides.forEach(function(s,i){
      s.addText(String(i+1),{x:11.8,y:6.95,w:1.2,h:0.4,fontSize:14,bold:true,align:'right',color:'333333'});
    });

    btn.innerHTML='กำลังบันทึกไฟล์…';
    const fname='รายงานอุปกรณ์ฉุกเฉิน-'+new Date().toISOString().slice(0,10)+'.pptx';
    // เอา Blob มาเองแทน writeFile() ซึ่งยิง <a download> ให้ข้างใน — จะได้คุมการส่งไฟล์เอง
    // pptxgenjs คืน type เป็น application/zip ต้องหุ้มใหม่เป็น MIME ของ PowerPoint
    // ไม่งั้นแอปปลายทางตอนแชร์จะเห็นเป็นไฟล์ zip (หุ้ม Blob ซ้ำไม่ได้คัดลอกข้อมูล)
    const blob=new Blob([await pptx.write({outputType:'blob'})],
      {type:'application/vnd.openxmlformats-officedocument.presentationml.presentation'});
    offerFile(blob,fname,'สร้าง PowerPoint สำเร็จ ('+slides.length+' สไลด์) — เลือกส่งหรือดาวน์โหลด');
  }catch(err){console.error(err);toast('เกิดข้อผิดพลาด: '+err.message);}
  finally{btn.disabled=false;btn.innerHTML=orig;}
};

// ---- storage health: แบนเนอร์เดียวที่สะท้อนสถานะจริงตลอดเวลา ----
function hasData(){return photoKeys.size>0||Object.keys(meta).length>0;}
function persistRisk(){
  if(!metaPersistOK||!photoPersistOK)return true;
  if(!STORAGE_OK&&hasData())return true;
  if(!idbOK&&photoKeys.size>0)return true;
  return false;
}
function updatePersistBanner(){
  let msg='';
  if(!STORAGE_OK)
    msg='⚠️ ตัวเปิดนี้ไม่อนุญาตให้บันทึกถาวร — ข้อมูล/รูปจะหายเมื่อปิดหน้านี้ แนะนำให้เปิดด้วย Safari หรือ Chrome และกด “สำรองข้อมูล” ในเมนู ⋯ ก่อนปิด';
  else if(!idbOK)
    msg='⚠️ เบราว์เซอร์นี้เก็บรูปภาพถาวรไม่ได้ — ผลตรวจถูกบันทึกไว้ แต่ “รูปภาพ” จะหายเมื่อปิดหน้านี้ แนะนำกด “สำรองข้อมูล” ในเมนู ⋯ ก่อนปิด';
  else if(!metaPersistOK||!photoPersistOK)
    msg='⚠️ บันทึกลงเครื่องไม่สำเร็จ (พื้นที่อาจเต็ม) — ข้อมูลล่าสุดยังไม่ปลอดภัย กรุณากด “สำรองข้อมูล” ในเมนู ⋯ ทันที';
  else if(!persisted&&hasData())
    msg='ℹ️ เบราว์เซอร์อาจลบข้อมูลนี้เองหากไม่ได้เปิดแอปนานหลายวัน — แนะนำกด “สำรองข้อมูล” ในเมนู ⋯ หลังตรวจเสร็จทุกครั้ง';
  let w=document.getElementById('persist-banner');
  if(!msg){if(w)w.remove();return;}
  if(!w){
    w=document.createElement('div');w.id='persist-banner';w.className='pbanner';
    const bar=document.querySelector('.bar');bar.parentNode.insertBefore(w,bar);
  }
  if(w.textContent!==msg)w.textContent=msg;
}
// iOS Safari ลบข้อมูลที่สคริปต์เขียนไว้ทั้งหมดถ้าไม่เปิดเว็บเกิน 7 วัน — ขอยกเว้นไว้ก่อน
async function requestPersist(){
  try{
    if(navigator.storage&&navigator.storage.persist)
      return (await navigator.storage.persisted())||(await navigator.storage.persist());
  }catch(e){}
  return false;
}
function fmtMB(n){return n>=1073741824?(n/1073741824).toFixed(1)+' GB':Math.round(n/1048576)+' MB';}
async function refreshStorageInfo(){
  const el=document.getElementById('opt-storage');
  const row=document.getElementById('row-orphan');
  row.style.display=orphanPhotoKeys.length?'flex':'none';
  if(orphanPhotoKeys.length)
    document.getElementById('orphan-label').textContent='ล้างรูปกำพร้า ('+orphanPhotoKeys.length+' รูป)';
  let txt='พื้นที่เก็บข้อมูล: '+photoKeys.size+' รูป'+(persisted?' · ป้องกันการลบอัตโนมัติแล้ว':'');
  try{
    if(navigator.storage&&navigator.storage.estimate){
      const q=await navigator.storage.estimate();
      if(q&&q.usage!=null&&q.quota){
        const pct=Math.round(q.usage/q.quota*100);
        txt='พื้นที่เก็บข้อมูล: ใช้ไป '+fmtMB(q.usage)+' จาก '+fmtMB(q.quota)+' ('+pct+'%) · '+photoKeys.size+' รูป';
        el.classList.toggle('warn',pct>=80);
        if(pct>=80)txt+=' — ใกล้เต็ม กรุณาสำรองข้อมูล';
      }
    }
  }catch(e){}
  el.textContent=txt;
}
document.getElementById('opt-orphan').onclick=async function(){
  const n=orphanPhotoKeys.length;if(!n)return;
  if(!confirm('ลบรูป '+n+' รูปที่ไม่ตรงกับรายการตรวจปัจจุบัน?\n(รูปเหล่านี้มาจากรายการที่ถูกแก้ไข/ลบไปแล้ว — ควรกด “สำรองข้อมูล” ก่อน)'))return;
  for(const k of orphanPhotoKeys){try{await idbDel(k);}catch(e){}}
  orphanPhotoKeys=[];refreshStorageInfo();toast('ลบรูปกำพร้า '+n+' รูปแล้ว');
};

async function init(){
  loadSettings();
  syncTopbarHeight();syncSearchClear();
  document.getElementById('opt-autonext').classList.toggle('on',autoNext);
  document.getElementById('opt-onlyphoto').classList.toggle('on',onlyPhotoExport);
  setupIO();
  await openDB();
  await loadAll();
  render();
  updatePersistBanner();
  persisted=await requestPersist();
  updatePersistBanner();
  refreshStorageInfo();
}
init().catch(function(err){
  document.getElementById('list').innerHTML='<div style="padding:30px 16px;color:#e0454e;font-size:14px">เกิดข้อผิดพลาดในการเริ่มต้น:<br>'+esc(err&&err.message||err)+'</div>';
  console.error(err);
});
</script>
